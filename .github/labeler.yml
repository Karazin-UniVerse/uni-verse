frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/uni-hub/**'
          - 'packages/ui/**'
          - '**/*.tsx'
          - '**/*.jsx'
          - 'Dockerfile.frontend'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/backend/**'
          - 'Dockerfile'

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/database/**'
          - '**/prisma/**'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/core/**'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - '**/*.test.*'
          - '**/*.spec.*'

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'configs/**'
          - 'turbo.json'
          - 'package.json'
          - 'pnpm-workspace.yaml'

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @universe/backend db:generate
      - name: Audit unused code and dependencies (advisory)
        run: pnpm knip --no-exit-code
      - run: pnpm lint
      - run: pnpm lint:style
      - run: pnpm typecheck
      - name: Run Backend Tests with Coverage
        run: |
          pnpm --filter @universe/backend test:cov
          node -e "const fs=require('fs'),p='packages/backend/coverage/lcov.info';if(fs.existsSync(p)){const c=fs.readFileSync(p,'utf8').split('\n').map(l=>{if(!l.startsWith('SF:'))return l;const r=l.slice(3).replace(/\\\\/g,'/'),i=r.lastIndexOf('packages/backend/');if(i!==-1)return'SF:'+r.slice(i);return'SF:packages/backend/'+r.replace(/^.*file:\/?/,'').replace(/^\\.\\//,'');}).join('\n');fs.writeFileSync(p,c);console.log('Normalized lcov paths for SonarCloud');}"
      - name: Run Frontend Tests
        run: |
          pnpm --filter @universe/ui test
          pnpm --filter @universe/uni-hub test
      - name: Build Storybook
        run: pnpm --filter @universe/ui build-storybook
      - name: Test Lighthouse support scripts
        run: pnpm test:lhci
      - name: Test Graphify wrapper
        run: pnpm test:graphify
      - name: Test Grip enrollment and push wrapper
        run: pnpm test:grip
      - name: Build with the Lighthouse mock API
        # Audit-only output: do not deploy/reuse this .next build for real-backend E2E tests.
        # Deployments build independently through .github/workflows/deploy.yml and the host.
        run: pnpm build --force
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_FEATURE_OPPORTUNITIES: 'true'
          NEXT_PUBLIC_FEATURE_MOODLE: 'false'
          NEXT_PUBLIC_FEATURE_EDEAN: 'false'
          NEXT_PUBLIC_FEATURE_PANEL: 'false'
      - name: Run Lighthouse CI (Web Vitals)
        run: pnpm lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]' && env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Notify Discord on CI Failure
        if: failure()
        env:
          DISCORD_PR_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          NOTIFY_MODE: ci-failure
        run: node .github/scripts/discord-pr-notify.mjs

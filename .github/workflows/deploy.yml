name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - stage

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'qa'
    environment:
      name: qa
    steps:
      - name: Trigger QA Deploy Webhook
        env:
          QA_WEBHOOK: ${{ secrets.QA_DEPLOY_WEBHOOK_URL }}
        if: env.QA_WEBHOOK != ''
        run: |
          echo "Triggering deployment to QA environment..."
          curl -f -X POST "${{ secrets.QA_DEPLOY_WEBHOOK_URL }}" || true

  deploy-stage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_env == 'stage'
    environment:
      name: stage
    steps:
      - name: Trigger Stage Deploy Webhook
        env:
          STAGE_WEBHOOK: ${{ secrets.STAGE_DEPLOY_WEBHOOK_URL }}
        if: env.STAGE_WEBHOOK != ''
        run: |
          echo "Triggering deployment to Stage environment..."
          curl -f -X POST "${{ secrets.STAGE_DEPLOY_WEBHOOK_URL }}" || true

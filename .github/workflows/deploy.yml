name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - stage
      stage_branch:
        description: 'Branch to deploy to Stage (default: main)'
        required: false
        default: 'main'

permissions: {}

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'qa')
    environment:
      name: qa
    steps:
      - name: Trigger QA Deploy Webhook
        env:
          QA_WEBHOOK: ${{ secrets.QA_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$QA_WEBHOOK" ]; then
            echo "::notice::QA_DEPLOY_WEBHOOK_URL is not configured. Webhook skipped (automatic deployment is handled directly by hosting provider)."
            exit 0
          fi
          echo "Triggering deployment to QA environment..."
          curl -f -X POST --connect-timeout 10 --max-time 30 "$QA_WEBHOOK"

  deploy-stage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.target_env == 'stage'))
    environment:
      name: stage
    steps:
      - name: Trigger Stage Backend Deploy
        env:
          STAGE_WEBHOOK: ${{ secrets.STAGE_DEPLOY_WEBHOOK_URL }}
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          STAGE_BRANCH: ${{ inputs.stage_branch || 'main' }}
        run: |
          if [ -n "$STAGE_WEBHOOK" ]; then
            echo "Triggering backend deployment to Stage via Webhook..."
            curl -f -X POST --connect-timeout 10 --max-time 30 "$STAGE_WEBHOOK"
            exit 0
          fi

          if [ -n "$NF_TOKEN" ]; then
            echo "Triggering backend deployment to Stage (branch: $STAGE_BRANCH)..."
            curl -f -X POST "https://api.northflank.com/v1/projects/universe-jewel/services/backend-stage/build" \
              -H "Authorization: Bearer $NF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"branch\":\"$STAGE_BRANCH\"}" \
              --connect-timeout 10 --max-time 30
            exit 0
          fi

          echo "::notice::Neither STAGE_DEPLOY_WEBHOOK_URL nor NORTHFLANK_API_TOKEN is configured. Backend deploy skipped."
          exit 0

      - name: Trigger Stage Frontend Deploy
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          STAGE_BRANCH: ${{ inputs.stage_branch || 'main' }}
        run: |
          if [ -z "$NF_TOKEN" ]; then
            echo "::notice::NORTHFLANK_API_TOKEN is not configured. Frontend deploy skipped."
            exit 0
          fi
          echo "Triggering frontend deployment to Stage (branch: $STAGE_BRANCH)..."
          curl -f -X POST "https://api.northflank.com/v1/projects/universe-jewel/services/frontend-stage/build" \
            -H "Authorization: Bearer $NF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":\"$STAGE_BRANCH\"}" \
            --connect-timeout 10 --max-time 30

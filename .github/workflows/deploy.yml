name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - stage

permissions: {}

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'qa')
    environment:
      name: qa
    steps:
      - name: Trigger QA Deploy Webhook
        env:
          QA_WEBHOOK: ${{ secrets.QA_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$QA_WEBHOOK" ]; then
            echo "::notice::QA_DEPLOY_WEBHOOK_URL is not configured. Webhook skipped (automatic deployment is handled directly by hosting provider)."
            exit 0
          fi
          echo "Triggering deployment to QA environment..."
          curl -f -X POST --connect-timeout 10 --max-time 30 "$QA_WEBHOOK"

  deploy-stage:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.target_env == 'stage'))
    environment:
      name: stage
    steps:
      - name: Trigger Stage Deploy Webhook
        env:
          STAGE_WEBHOOK: ${{ secrets.STAGE_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$STAGE_WEBHOOK" ]; then
            echo "::notice::STAGE_DEPLOY_WEBHOOK_URL is not configured. Webhook skipped."
            exit 0
          fi
          echo "Triggering deployment to Stage environment..."
          curl -f -X POST --connect-timeout 10 --max-time 30 "$STAGE_WEBHOOK"

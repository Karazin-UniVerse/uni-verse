name: Discord PR Reminder

on:
  schedule:
    # Morning reminder: 05:20 UTC = 08:20 EEST (Kyiv time, UTC+3), Monday - Friday
    - cron: '20 5 * * 1-5'
    # Evening reminder: 14:00 UTC = 17:00 EEST (Kyiv time, UTC+3), Monday - Friday
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  remind-prs:
    name: Send Active PRs Reminder to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Send PR Digest to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_PR_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          NOTIFY_MODE: reminder
        run: node .github/scripts/discord-pr-notify.mjs

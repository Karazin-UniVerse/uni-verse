name: Discord PR Reminder

on:
  schedule:
    # Morning reminder: 08:20 Kyiv time, Monday - Friday
    - cron: '20 8 * * 1-5'
      timezone: 'Europe/Kyiv'
    # Evening reminder: 17:00 Kyiv time, Monday - Friday
    - cron: '0 17 * * 1-5'
      timezone: 'Europe/Kyiv'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  remind-prs:
    name: Send Active PRs Reminder to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Send PR Digest to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_PR_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
          NOTIFY_MODE: reminder
        run: node .github/scripts/discord-pr-notify.mjs

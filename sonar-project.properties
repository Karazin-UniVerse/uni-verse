sonar.projectKey=Karazin-UniVerse_uni-verse
sonar.organization=karazin-universe
sonar.projectName=uni-verse
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io

# Sources for monorepo packages
sonar.sources=packages/backend,packages/uni-hub,packages/ui
sonar.tests=packages/backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts

# Exclusions
sonar.exclusions=packages/backend/test/**,**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.config.*,**/prisma/migrations/**,**/prisma/seed*.ts,**/*.d.ts,**/.storybook/**,**/.turbo/**,**/*.stories.*
# Exclude test files, stories, and packages without test suites from coverage gate
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/test/**,**/*.stories.*,packages/backend/main.ts,packages/backend/**/*.module.ts,packages/backend/**/*.dto.ts,packages/backend/types/**,packages/backend/prisma/**,packages/uni-hub/**,packages/ui/**
# Exclude translation dictionaries and test files from duplication detection
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/locales/**,**/i18n/locales/**,packages/uni-hub/i18n/locales/**

# Test coverage
sonar.javascript.lcov.reportPaths=packages/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

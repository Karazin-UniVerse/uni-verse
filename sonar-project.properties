sonar.projectKey=Karazin-UniVerse_uni-verse
sonar.organization=karazin-universe
sonar.projectName=uni-verse
sonar.projectVersion=1.0

# Sources for monorepo packages
sonar.sources=packages/backend/src,packages/uni-hub/src,packages/core/src,packages/ui/src,packages/database/src
sonar.tests=packages/backend/src,packages/backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.config.*,**/prisma/migrations/**,**/*.d.ts

# Test coverage
sonar.javascript.lcov.reportPaths=packages/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

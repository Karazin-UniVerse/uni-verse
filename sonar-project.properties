sonar.projectKey=Karazin-UniVerse_uni-verse
sonar.organization=karazin-universe
sonar.projectName=uni-verse
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io

# Sources for monorepo packages
sonar.sources=packages/backend/src,packages/uni-hub/src,packages/ui
sonar.tests=packages/backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.config.*,**/prisma/migrations/**,**/*.d.ts,**/.storybook/**,**/.turbo/**,**/*.stories.*
# Exclude test files, stories, and packages without test suites from coverage gate
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/test/**,**/*.stories.*,packages/uni-hub/**,packages/ui/**

# Test coverage
sonar.javascript.lcov.reportPaths=packages/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
